*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3ead5;color:#332d25}header{background:#27543a;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:4}h1{margin:0;font-size:22px}header small{opacity:.8}.wrap{padding:14px 14px 90px;max-width:800px;margin:auto}.card{background:#fffaf0;border:1px solid #dfd2b8;border-radius:16px;padding:13px;margin:9px 0}.bar{height:12px;background:#ddd2bd;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#4e8059}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.muted{font-size:13px;color:#756c60}.tag{display:inline-block;background:#eee3ca;border-radius:10px;padding:4px 7px;font-size:11px;margin:4px 3px 0 0}.red{background:#f5d3d0;color:#8d2e31}input[type=checkbox]{width:24px;height:24px;accent-color:#477653}input[type=number]{width:70px;padding:8px;border:1px solid #d7c9ad;border-radius:10px;font-size:16px}select,input[type=search]{width:100%;padding:11px;border:1px solid #d7c9ad;border-radius:12px;background:white;font-size:16px;margin:4px 0}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fffdf8;border-top:1px solid #ddd1bb;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;padding:8px 2px;font-size:12px}.nav button.on{color:#27543a;font-weight:800}.big{font-size:28px;font-weight:800;color:#27543a}button.season{border:0;border-radius:12px;padding:9px;background:#e9dfc9;margin:2px}button.season.on{background:#27543a;color:white}.money{font-weight:800;color:#805d10}

rbst", "Kürbis", 100, 13, 2, 320, "CC + Goldkürbisse"], ["Herbst", "Yamswurzel", 60, 10, 2, 160, "CC"]]}; const K="junimo_v2"; let S=JSON.parse(localStorage.getItem(K)||'{"done":{},"have":{}}'); let page="home";
const key=x=>x[1]+"|"+x[2]+"|"+x[3], save=()=>localStorage.setItem(K,JSON.stringify(S));
const isdone=x=>S.done[key(x)]||((S.have[key(x)]||0)>=x[4]);
function card(x){let k=key(x),h=S.have[k]||0;return `<div class="card"><div class="row"><input type="checkbox" data-d="${encodeURIComponent(k)}" ${isdone(x)?"checked":""}><div class="grow"><b>${x[3]}</b><div class="muted">${x[1]} · ${x[2]}</div></div></div><div><span class="tag">${x[0]}</span>${x[7]?`<span class="tag ${x[7]=="Regen"?"red":""}">${x[7]}</span>`:""}</div><p class="muted">📍 ${x[5]} ${x[6]?" · 🕒 "+x[6]:""}</p><div class="row between"><small>Benötigt <b>${x[4]}</b> · Fehlt <b>${Math.max(0,x[4]-h)}</b></small><label><small>Habe</small> <input type="number" min="0" data-h="${encodeURIComponent(k)}" value="${h}"></label></div></div>`}
function bind(){document.querySelectorAll("[data-d]").forEach(e=>e.onchange=()=>{S.done[decodeURIComponent(e.dataset.d)]=e.checked;save();render()});document.querySelectorAll("[data-h]").forEach(e=>e.onchange=()=>{S.have[decodeURIComponent(e.dataset.h)]=Math.max(0,+e.value||0);save();render()})}
function home(){let n=D.items.filter(isdone).length,p=Math.round(n/D.items.length*100),crit=D.items.filter(x=>!isdone(x)&&(["Wels","Aal","Kugelfisch","Zander","Roter Schnapper","Rotkohl","Nautilusmuschel"].includes(x[3])));return `<h2>Fortschritt</h2><div class="card"><div class="row between"><b>${n} / ${D.items.length}</b><span class="big">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div><h2>Nicht verpassen</h2>${crit.map(card).join("")||'<div class="card">Alles Kritische erledigt.</div>'}`}
function cc(){return `<h2>Gemeinschaftszentrum</h2><input id="q" type="search" placeholder="Suchen…"><select id="s"><option>Alle Jahreszeiten</option>${["Frühling","Sommer","Herbst","Winter","Ganzjährig"].map(x=>`<option>${x}</option>`).join("")}</select><div id="list"></div>`}
function ccList(){let q=(document.querySelector("#q").value||"").toLowerCase(),s=document.querySelector("#s").value;let a=D.items.filter(x=>(!q||(x[3]+" "+x[2]+" "+x[1]).toLowerCase().includes(q))&&(s=="Alle Jahreszeiten"||x[0].includes(s)||x[0]=="Ganzjährig"||x[0]=="Variabel"));document.querySelector("#list").innerHTML=a.map(card).join("");bind()}
function fish(){return `<h2>Fisch-Guide</h2><select id="fs"><option>Alle</option>${["Frühling","Sommer","Herbst","Winter"].map(x=>`<option>${x}</option>`).join("")}</select><select id="fw"><option>Jedes Wetter</option><option>Regen</option><option>Sonnig</option></select><div id="fl"></div>`}
function fishList(){let s=document.querySelector("#fs").value,w=document.querySelector("#fw").value,a=D.items.filter(x=>x[1]=="Fischbecken"&&(s=="Alle"||x[0].includes(s)||x[0]=="Ganzjährig")&&(w=="Jedes Wetter"||x[7]==w));document.querySelector("#fl").innerHTML=a.map(card).join("");bind()}
function profit(){return `<h2>Gewinn pro Jahreszeit</h2><p class="muted">Rohverkauf, normale Qualität, ohne Dünger/Berufe. Pro Feld.</p><div id="ps">${["Frühling","Sommer","Herbst"].map((s,i)=>`<button class="season ${i?"":"on"}" data-s="${s}">${s}</button>`).join("")}</div><div id="pl"></div>`}
function profitList(s){document.querySelectorAll(".season").forEach(b=>b.classList.toggle("on",b.dataset.s==s));let a=D.profits.filter(x=>x[0]==s).map(x=>{let revenue=x[4]*x[5],cost=x[2]*(x[3]&&x[4]>2?1:x[4]),profit=revenue-cost;return {x,profit,gpd:profit/28}}).sort((a,b)=>b.gpd-a.gpd);document.querySelector("#pl").innerHTML=a.map((o,i)=>`<div class="card"><div class="row between"><b>${i==0?"🏆 ":""}${o.x[1]}</b><span class="money">${o.gpd.toFixed(2)} G/Tag</span></div><p class="muted">Saat ${o.x[2]} G · Wachstum ${o.x[3]} Tage · ${o.x[4]} Ernten · Reingewinn ca. ${o.profit.toFixed(0)} G</p><small>${o.x[6]}</small></div>`).join("")}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p==page));let a=document.querySelector("#app");a.innerHTML=page=="home"?home():page=="cc"?cc():page=="fish"?fish():profit();bind();if(page=="cc"){ccList();q.oninput=ccList;s.onchange=ccList}if(page=="fish"){fishList();fs.onchange=fishList;fw.onchange=fishList}if(page=="profit"){profitList("Frühling");document.querySelectorAll(".season").forEach(b=>b.onclick=()=>profitList(b.dataset.s))}}

</script></body></html>
