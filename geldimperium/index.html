<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14181f">
<title>Geldimperium</title>
<style>
:root{
  --bg:#14181f; --panel:#1f2530; --panel2:#2a3240; --text:#f2f5f9; --mute:#8d99ab;
  --green:#3ddc84; --green2:#1f9d57; --gold:#ffc83d; --gem:#4cc9ff; --blue:#3b82f6; --red:#ff5d5d;
  --v1:#27406b; --v2:#1b2c4a; --vf:#243247; --door1:#c9d3e3; --door2:#7c8aa3; --rim:#ffc83d; --stack1:#58f09a; --stack2:#1f9d57;
}
[data-theme=neon]{--bg:#0d0b1a;--panel:#1a1633;--panel2:#272047;--green:#36f1cd;--green2:#0fa38a;--blue:#8b5cf6;--v1:#2a1a55;--v2:#170f38;--vf:#221a44;--door1:#c8c2ff;--door2:#6d5fd0;--rim:#36f1cd;--stack1:#7ffbe5;--stack2:#0fa38a}
[data-theme=gold]{--bg:#1c150a;--panel:#2a2112;--panel2:#3a2e19;--green:#ffcf4a;--green2:#c99a14;--blue:#d97706;--v1:#5a3a0a;--v2:#3a2406;--vf:#4a3612;--door1:#fff0b0;--door2:#c99a14;--rim:#fff0b0;--stack1:#ffe27a;--stack2:#c99a14}
[data-theme=rose]{--bg:#1f1418;--panel:#301e25;--panel2:#42293a;--green:#ff8fab;--green2:#d6336c;--blue:#7c5cff;--v1:#5a2a4a;--v2:#3a1a30;--vf:#4a2640;--door1:#ffd3e0;--door2:#c0638a;--rim:#ff8fab;--stack1:#ffb3c7;--stack2:#d6336c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ic{display:block;width:100%;height:100%}
.mi{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 80%,transparent);padding:10px 12px 14px}
.row{display:flex;align-items:center;gap:8px}
.lvl{position:relative;display:flex;align-items:center;flex:1;min-width:0}
.hex{width:42px;height:42px;background:var(--gold);color:#4a3000;font-weight:800;font-size:20px;display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);z-index:1;flex:none}
.xp{flex:1;height:22px;margin-left:-10px;background:#0d1015;border-radius:0 12px 12px 0;overflow:hidden;position:relative;border:2px solid #3a2f10}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ffd966,#e0a020);width:0}
.xp span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
.cur{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;background:var(--panel);border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}
.chip .mi{flex:none;width:22px;height:22px;vertical-align:0}
.chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.cash{flex:2;color:var(--green)}
.chip.gold{color:var(--gold)} .chip.gem{color:var(--gem)}

/* Tresor-Szene */
.vault{margin:4px 12px 12px;height:150px;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(var(--v1),var(--v2) 60%,var(--vf) 60%);}
.vault::before{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;
  background:repeating-conic-gradient(#d9e2f0 0 25%,#bcc8da 0 50%) 0 0/28px 28px;opacity:.55;transform:perspective(200px) rotateX(35deg);transform-origin:bottom}
.door{position:absolute;right:14px;top:16px;width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--door1),var(--door2) 70%);border:8px solid var(--rim);box-shadow:0 4px 0 #0006,inset 0 0 0 6px #0003}
.door::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--rim);box-shadow:0 0 0 5px #0004}
.stacks{position:absolute;left:10px;bottom:10px;right:120px;display:flex;flex-wrap:wrap-reverse;gap:3px;align-content:flex-start;max-height:120px;overflow:hidden}
.st{width:20px;height:14px;background:linear-gradient(var(--stack1),var(--stack2));border-radius:3px;border-bottom:3px solid #0004;box-shadow:0 1px 0 #0006;position:relative}
.st::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;color:#0007}
.vt{position:absolute;left:12px;top:8px;font-size:12px;color:#9fb4d8;font-weight:700;letter-spacing:.06em}
.vps{position:absolute;right:14px;bottom:10px;font-size:13px;font-weight:800;color:var(--green);background:#0d1015aa;padding:3px 8px;border-radius:10px;z-index:2}
.boostbar{position:absolute;left:0;top:0;height:4px;background:var(--gem);width:0;z-index:2}
.workers{position:absolute;inset:0;pointer-events:none;z-index:1}
.wk{position:absolute;display:flex;align-items:flex-end;animation:walk 6s linear infinite alternate;white-space:nowrap}
.wk .ic{width:28px;height:28px}.wk .ic+.ic{width:14px;height:14px;margin-left:-4px}
@keyframes walk{from{left:42%}to{left:62%}}

/* Kaufmodus & Inselwahl */
.chips{display:flex;gap:6px;margin:0 12px 10px;overflow-x:auto}
.chips button{background:var(--panel);padding:6px 12px 6px 8px;border-radius:999px;font-weight:700;white-space:nowrap;color:var(--mute);display:flex;align-items:center;gap:6px}
.chips button .ic{width:20px;height:20px}
.chips button.on{background:var(--green2);color:#fff}
.modes{display:flex;gap:6px;margin:0 12px 10px}
.modes button{flex:1;background:var(--panel);padding:8px 0;border-radius:10px;font-weight:700;color:var(--mute)}
.modes button.on{background:var(--blue);color:#fff}

/* Geschäfte */
.list{padding:0 12px;display:flex;flex-direction:column;gap:10px}
.biz{background:var(--panel);border-radius:16px;padding:10px;display:grid;grid-template-columns:56px 1fr;gap:10px;position:relative}
.biz.locked{opacity:.45;filter:grayscale(.8)}
.ico{width:56px;height:56px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;position:relative;cursor:pointer}
.ico .ic{width:42px;height:42px}
.ico small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--gold);color:#4a3000;font-weight:800;font-size:11px;padding:0 6px;border-radius:8px}
.ico em{position:absolute;top:-6px;right:-8px;font-size:10px;font-style:normal;font-weight:800;color:#4a3000;background:var(--gem);border-radius:8px;padding:0 4px}
.ico em:empty{display:none}
.bm{min-width:0}
.bt{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.bt b{font-size:16px}
.bt span{font-size:12px;color:var(--mute);white-space:nowrap}
.bar{height:20px;background:#0d1015;border-radius:10px;margin:6px 0;overflow:hidden;position:relative;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(var(--green),var(--green2))}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000a}
.ms{height:4px;background:#0d1015;border-radius:2px;overflow:hidden;margin-bottom:6px}
.ms i{display:block;height:100%;background:var(--gold)}
.acts{display:flex;gap:6px}
.buy{flex:1;min-width:0;background:var(--blue);border-radius:10px;padding:7px 8px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;gap:6px;align-items:center;white-space:nowrap}
.buy small{font-size:12px;font-weight:600;opacity:.9}
.mgr{font-size:14px}
.buy:disabled{background:#3a4354;color:#7c879a}
.mgr{background:var(--gold);color:#3a2800;border-radius:10px;padding:7px 10px;font-weight:800;white-space:nowrap}
.mgr:disabled{background:#3a4354;color:#7c879a}
.mgr.has{background:var(--green2);color:#fff}

/* Karten, Knöpfe */
.card{margin:14px 12px 0;background:var(--panel);border-radius:16px;padding:14px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:4px 0 10px;color:var(--mute);font-size:14px}
.big{width:100%;padding:12px;border-radius:12px;font-weight:800;background:var(--gold);color:#3a2800}
.big:disabled{background:#3a4354;color:#7c879a}
.big.gem{background:var(--gem);color:#02283a}
.big.gr{background:var(--green2);color:#fff}
.small{padding:8px 12px;border-radius:10px;font-weight:800;background:var(--gold);color:#3a2800;white-space:nowrap}
.small:disabled{background:#3a4354;color:#7c879a}
.small.gem{background:var(--gem);color:#02283a}
.small.gr{background:var(--green2);color:#fff}
.page{padding-top:2px}
.h1{margin:6px 14px 10px;font-size:22px;font-weight:800}

/* Karte */
.mapinfo{margin:0 12px 8px;display:flex;gap:6px;flex-wrap:wrap}
.mapinfo span{background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--mute)}
.map{position:relative;height:800px;margin:0 12px;border-radius:20px;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,#2a86c2,#164a78 75%)}
.deco{position:absolute;width:30px;height:30px;opacity:.7;animation:drift 8s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(22px,-8px)}}
.ship{position:absolute;width:38px;height:38px;animation:sail 28s linear infinite;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 3px #0006)}
@keyframes sail{from{left:-12%}to{left:106%}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.night .fx.n{background:radial-gradient(circle at 50% 30%,#0a103000,#0a1030cc);}
.fx.n i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.fx.sun{background:radial-gradient(circle at 88% 6%,#fff6b055,transparent 40%)}
.fx.rain{background:repeating-linear-gradient(105deg,transparent 0 14px,#cfe8ff44 14px 15px);background-size:40px 40px;animation:rain .5s linear infinite;opacity:.6}
@keyframes rain{to{background-position:-12px 40px}}
.cl{position:absolute;width:90px;height:90px;opacity:.55;animation:sail 60s linear infinite;pointer-events:none;z-index:4}
.isl{position:absolute;width:44%;text-align:center;cursor:pointer;z-index:2}
.blob{height:128px;border:8px solid var(--rim2,#e8d48f);border-radius:48% 52% 45% 55%/55% 45% 55% 45%;
  background:radial-gradient(circle at 40% 35%,var(--b1,#6fdc7a),var(--b2,#2f9d4e) 80%);display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 10px 18px #0007}
.isl.lock .blob{filter:grayscale(1) brightness(.55)}
.isl.sel .blob{outline:3px solid var(--gold);outline-offset:4px}
.owned{display:flex;flex-wrap:wrap;gap:0;justify-content:center;align-items:center}
.owned .ic{width:26px;height:26px}
.owned em{font-size:13px;opacity:.8;font-style:normal}
.owned .lk{width:34px;height:34px;opacity:.9}
.isl .nm{font-weight:800;margin-top:7px;text-shadow:0 2px 3px #000;display:flex;gap:6px;align-items:center;justify-content:center}
.isl .nm .ic{width:20px;height:20px}
.isl .sub{font-size:12px;font-weight:700;background:#000b;border-radius:10px;display:inline-block;padding:2px 8px;margin-top:2px}
.sub.no{color:var(--red)} .sub.yes{color:var(--green)}
.cf2{position:absolute;width:20px;height:20px;top:40px;pointer-events:none;animation:flo 3.4s ease-out infinite;opacity:0}
@keyframes flo{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}

/* Aufgaben / Erfolge */
.task{padding:8px 0;border-top:1px solid #2d3646}
.task:first-of-type{border-top:0}
.tt{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.tt b{color:var(--gem);white-space:nowrap}
.task.ok .tt span{color:var(--green)}
.pb{height:16px;background:#0d1015;border-radius:8px;overflow:hidden;position:relative}
.pb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(var(--gold),#d89a10)}
.task.ok .pb i{background:linear-gradient(var(--green),var(--green2))}
.pb span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000a}

/* Shop / Mehr / Sammlung */
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #2d3646}
.line:first-of-type{border-top:0}
.line>div{min-width:0;font-size:14px}
.line small{display:block;color:var(--mute)}
.line>div>.ic{display:inline-block;width:26px;height:26px;vertical-align:middle;margin-right:4px}
.big.gem .mi,.small.gem .mi{filter:brightness(.4) saturate(1.5)}
.line .btns{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;background:#0d1015;display:block}
.pips i.on{background:var(--gold)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #2d3646;font-size:14px}
.stat:first-of-type{border-top:0}
.stat b{color:var(--green)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.tile{background:var(--panel2);border-radius:14px;padding:6px 4px 8px;text-align:center;border:2px solid var(--rc,#8d99ab);min-width:0}
.tile .ic{width:100%;height:auto;aspect-ratio:1}
.tile b{display:block;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:10px;color:var(--mute)}
.tile.off{border-color:#3a4354;opacity:.4;filter:grayscale(1)}
.sw{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle}
.sw i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid #fff3}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.navin{display:flex;gap:2px;width:100%;max-width:540px;background:var(--panel);border-radius:22px;padding:5px;box-shadow:0 4px 20px #000a}
.navin button{flex:1;min-width:0;background:none;border-radius:16px;padding:6px 0 4px;font-size:10px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.navin button .ic{width:24px;height:24px}
.navin button.on{background:var(--panel2);color:#fff}

/* Effekte */
.case{position:fixed;z-index:20;width:56px;height:56px;padding:0;background:none;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 4px 6px #000a)}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.pop{position:fixed;z-index:30;pointer-events:none;font-weight:800;color:var(--green);text-shadow:0 2px 3px #000;animation:up 1s ease-out forwards;transform:translateX(-50%)}
@keyframes up{to{transform:translate(-50%,-56px);opacity:0}}
.cf{position:fixed;z-index:50;pointer-events:none;width:22px;height:22px;left:50%;top:38%;animation:cfa 1.1s ease-out forwards}
@keyframes cfa{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000e;padding:10px 16px;border-radius:14px;z-index:40;font-weight:700;max-width:90%;text-align:center}
.foot{text-align:center;color:var(--mute);font-size:12px;margin:18px 12px}
.foot a{color:var(--mute)}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <div class="lvl"><div class="hex" id="lvl">1</div><div class="xp"><i id="xpf"></i><span id="xpt"></span></div></div>
  </div>
  <div class="cur">
    <div class="chip cash"><i class="mi" id="ci1"></i><b id="cash">0</b></div>
    <div class="chip gold"><i class="mi" id="ci2"></i><b id="gold">0</b></div>
    <div class="chip gem"><i class="mi" id="ci3"></i><b id="gems">0</b></div>
  </div>
</div>

<!-- Geschäfte -->
<section id="v-biz">
  <div class="vault">
    <div class="boostbar" id="boostbar"></div>
    <div class="vt">TRESORRAUM</div>
    <div class="stacks" id="stacks"></div>
    <div class="workers" id="workers"></div>
    <div class="door"></div>
    <div class="vps" id="vps">0 / Sek.</div>
  </div>
  <div class="chips" id="isleBar"></div>
  <div class="modes" id="modes">
    <button data-act="mode" data-m="1" class="on">x1</button>
    <button data-act="mode" data-m="10">x10</button>
    <button data-act="mode" data-m="100">x100</button>
    <button data-act="mode" data-m="0">Max</button>
  </div>
  <div class="list" id="list"></div>
  <div class="card">
    <h3>Neustart</h3>
    <p id="prText"></p>
    <button class="big" id="prBtn" data-act="prestige">Neustart</button>
  </div>
</section>

<section id="v-map" class="page" hidden></section>
<section id="v-tasks" class="page" hidden></section>
<section id="v-coll" class="page" hidden></section>
<section id="v-shop" class="page" hidden></section>
<section id="v-more" class="page" hidden></section>

<nav><div class="navin" id="nav"></div></nav>

<script src="art.js"></script>
<script>
"use strict";
/* ================= Daten ================= */
const C6=[4,60,720,8640,103680,1244160], I6=[1,60,540,4320,51840,622080],
      T6=[1,3,6,12,24,96], K6=[1.07,1.15,1.14,1.13,1.12,1.11], M6=[1e3,15e3,1e5,5e5,1.2e6,1e7];
const gen=(s,list)=>list.map(([n,a],m)=>({n,a,c:C6[m]*s,k:K6[m],inc:I6[m]*s,t:T6[m],m:M6[m]*s}));

const ISL=[
  {n:"Startinsel", col:["#6fdc7a","#2f9d4e","#e8d48f"], unlock:0, pos:["4%","610px"], biz:[
    {n:"Limonadenstand", a:"lemon",     c:4,         k:1.07, inc:1,        t:1,    m:1e3},
    {n:"Markt",          a:"market",    c:60,        k:1.15, inc:60,       t:3,    m:15e3},
    {n:"Bäckerei",       a:"croissant", c:720,       k:1.14, inc:540,      t:6,    m:1e5},
    {n:"Autohaus",       a:"car",       c:8640,      k:1.13, inc:4320,     t:12,   m:5e5},
    {n:"Tech-Büro",      a:"laptop",    c:103680,    k:1.12, inc:51840,    t:24,   m:1.2e6},
    {n:"Bank",           a:"bank",      c:1244160,   k:1.11, inc:622080,   t:96,   m:1e7},
    {n:"Casino",         a:"casino",    c:14929920,  k:1.10, inc:7464960,  t:384,  m:1.1e8},
    {n:"Raumfahrt",      a:"rocket",    c:179159040, k:1.09, inc:89579520, t:1536, m:1.3e9},
    {n:"Ölraffinerie",   a:"oil",       c:2.15e9,    k:1.09, inc:1.07e9,   t:3072, m:1.5e10},
    {n:"Mondbasis",      a:"moon",      c:2.58e10,   k:1.08, inc:1.29e10,  t:6144, m:2e11},
  ]},
  {n:"Palmenstrand", col:["#7fe3c4","#1fa889","#f3dfa0"], unlock:1e10, pos:["50%","470px"], biz:gen(2.5e8,[
    ["Kokosstand","coconut"],["Surfschule","surf"],["Strandhotel","hotel"],["Yachthafen","yacht"],["Perlenfarm","pearl"],["Freizeitpark","park"]])},
  {n:"Vulkaninsel", col:["#8a8f9c","#3d424f","#ff7a3d"], unlock:1e15, pos:["6%","310px"], biz:gen(2.5e11,[
    ["Obsidianmine","obsidian"],["Lavaspa","lavaspa"],["Kristallhöhle","crystal"],["Drachenzucht","dragon"],["Magmakraftwerk","power"],["Schatzkammer","chest"]])},
  {n:"Eisinsel", col:["#f2fbff","#a9d8f0","#cfe9f7"], unlock:1e20, pos:["50%","170px"], biz:gen(2.5e14,[
    ["Eiscafé","icecream"],["Pinguinzoo","penguin"],["Skiresort","ski"],["Polarlabor","lab"],["Eisbrecher","icebreaker"],["Nordlichtshow","aurora"]])},
  {n:"Wolkenstadt", col:["#ffffff","#c9b8ff","#f0e9ff"], unlock:1e26, pos:["6%","12px"], biz:gen(2.5e17,[

function fmt(n){
  if(!isFinite(n)) return "∞";
  if(n<1000) return n<10&&n%1 ? n.toFixed(2) : Math.floor(n).toString();
  if(S.nf==="sci") return n.toExponential(2).replace("+","");
  let i=Math.floor(Math.log10(n)/3), v=n/Math.pow(1000,i);
  const list=S.nf==="de"?SUFD:SUF, dig=x=>x.toFixed(x<10?2:x<100?1:0);
  if(parseFloat(dig(v))>=1000){ i++; v/=1000; }
  if(i>=list.length) return n.toExponential(2).replace("+","");
  return dig(v)+(S.nf==="de"?" ":"")+list[i];
}
function fmtT(s){
  if(s<60) return (s<10&&s%1 ? s.toFixed(1) : Math.round(s))+" s";
  if(s<3600) return Math.floor(s/60)+" min "+Math.round(s%60)+" s";
  return Math.floor(s/3600)+" h "+Math.round((s%3600)/60)+" min";
}

function snd(kind){
  if(!S.sound) return;
  try{
    const a=actx(), t=a.currentTime;
    const seq={coin:[[880,0],[1320,.07]],buy:[[440,0],[660,.06]],lvl:[[523,0],[659,.1],[784,.2],[1047,.3]],ok:[[660,0],[880,.08]]}[kind]||[];
    seq.forEach(([f,d])=>{
      const o=a.createOscillator(), g=a.createGain();
      o.type="square"; o.frequency.value=f;
      g.gain.setValueAtTime(.04,t+d); g.gain.exponentialRampToValueAtTime(.0001,t+d+.12);
      o.connect(g); g.connect(a.destination); o.start(t+d); o.stop(t+d+.13);
    });
  }catch(e){}
}
let musicT=0, mStep=0;
function musicSet(){
  clearInterval(musicT); musicT=0;

  const sc=[262,294,330,392,440,523,587,659], pat=[0,2,4,2,5,4,2,1,0,2,4,7,5,4,2,3];
  musicT=setInterval(()=>{
    if(document.hidden) return;
    try{
      const a=actx(), t=a.currentTime, f=sc[pat[mStep%pat.length]]*(mStep%32<16?1:1.125);
      const o=a.createOscillator(), g=a.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.34);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.36); mStep++;

function cyclePop(k,i,g){
  if(tab!=="biz"||k!==S.cur) return;
  const c=cards[i]; if(!c) return;
  const now=performance.now(); if(now-(c.p||0)<800) return; c.p=now;
  const r=c.fill.getBoundingClientRect();
  if(r.top<90||r.bottom>innerHeight-80) return;
  pop(r.left+r.width/2,r.top,"+"+fmt(g));
}
function advance(dt,offline){
  let total=0;
  ISL.forEach((I,k)=>{
    if(!S.isl[k].un) return;
    S.isl[k].b.forEach((b,i)=>{
      if(b.lvl<1||(!b.run&&!b.mgr)||(offline&&!b.mgr)) return;
      b.prog+=dt/I.biz[i].t;
      if(b.prog>=1){
        const times=b.mgr ? Math.floor(b.prog) : 1;
        const g=incomeOf(k,i)*times; total+=g;
        if(b.mgr) b.prog-=times; else { b.prog=0; b.run=false; if(!offline) snd("coin"); }
        if(!offline) cyclePop(k,i,g);
      }
    });
  });
  if(total>0) earn(total);
  return total;
}

  $("prBtn").disabled=g<1;

}

/* ================= Aufgaben ================= */
function prog(text,got,need,r,done){
  const pct=Math.min(100,100*got/need);
  return `<div class="task ${done?"ok":""}"><div class="tt"><span>${done?"✓ ":""}${text}</span><b>+${r} ${$G}</b></div>
    <div class="pb"><i style="width:${pct}%"></i><span>${fmt(Math.min(got,need))} / ${fmt(need)}</span></div></div>`;
}
function seasonText(r){
  const p=[]; if(r.gem) p.push(r.gem+" Edelsteine"); if(r.gold) p.push(r.gold+" Gold");
  if(r.cash) p.push("Geld (x"+r.cash+")"); if(r.pack) p.push("1 Figur gratis"); return p.join(" + ");
}

    <button class="big gr" data-act="gift" ${can?"":"disabled"}>${can?"Abholen":"Abgeholt ✓"}</button></div>`;
  h+=`<div class="card"><h3>Tagesaufgaben</h3>`+S.daily.t.map(t=>prog(DT[t.k](t.need),t.got,t.need,t.r,t.done)).join("")
     +`<p style="margin:8px 0 0">${S.daily.bonus?"✓ Bonus abgeholt (+5 "+$G+")":"Alle vier erledigt: +5 "+$G+" Bonus."} Jede Aufgabe gibt 5 Saisonpunkte.</p></div>`;

     +`<p style="margin:8px 0 0">Neue Aufgaben jeden Montag. Jede gibt 25 Saisonpunkte.</p></div>`;

  h+=`<div class="card"><h3>Erfolge (${done}/${ACH.length})</h3>`+ACH.map((a,idx)=>prog(a.t,a.v(),a.n,a.r,!!S.ach[idx])).join("")+`</div>`;

function exportSave(){
  const s=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(()=>toast("Spielstand-Code kopiert. Bewahre ihn sicher auf."),()=>prompt("Spielstand-Code (kopieren):",s));
  }else prompt("Spielstand-Code (kopieren):",s);
}
function importSave(){
  const t=prompt("Spielstand-Code hier einfügen (ersetzt den aktuellen Spielstand):");
  if(!t) return;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
    if(!Array.isArray(d.isl)||typeof d.cash!=="number") throw 0;
    localStorage.setItem(KEY,JSON.stringify(d));
    load(); applyTheme(); buildCards(); musicSet(); render(); toast("Spielstand importiert.");
  }catch(e){ toast("Der Code ist ungültig."); }
}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, k=el.dataset.k!==undefined ? +el.dataset.k : S.cur, i=+el.dataset.i;
  if(a==="tab"){ showTab(el.dataset.t); return; }
  if(a==="mode"){
    mode=+el.dataset.m;
    document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on",+x.dataset.m===mode));
    render(); return;
  }
  if(a==="tap") tapBiz(S.cur,i);
  else if(a==="buy") buy(S.cur,i,ev);
  else if(a==="hire") hire(S.cur,i);
  else if(a==="isl"){ S.cur=k; buildCards(); if(el.dataset.go==="1") showTab("biz"); else render(); }
  else if(a==="unlock"){
    const I=ISL[k];
    if(S.cash<I.unlock){ toast("Dir fehlen noch "+fmt(I.unlock-S.cash)+" Geld"); return; }
    S.cash-=I.unlock; S.isl[k].un=true; S.cur=k; buildCards();
    toast(I.n+" freigeschaltet! +25 % Einkommen"); confetti(); snd("lvl"); save(true); render();
  }
  else if(a==="prestige") startPrestige();
  else if(a==="boost"){
    if(boosted()||S.gems<BOOST_COST) return;
    S.gems-=BOOST_COST; S.boostUntil=Date.now()+BOOST_MS; snd("ok"); save(true); render();
  }
  else if(a==="workers"){
    const c=WORKER_COSTS[S.workers]; if(c===undefined||S.gems<c) return;
    S.gems-=c; S.workers++; snd("ok"); toast("Neuer Mitarbeiter! +10 % Einkommen"); save(true); render();
  }
  else if(a==="tree"){
    const T=TREE.find(x=>x.k===el.dataset.id), c=T.cost[S.tree[T.k]];
    if(c===undefined||S.gold<c) return;
    S.gold-=c; S.tree[T.k]++; snd("ok"); toast(T.n+" auf Stufe "+S.tree[T.k]); save(true); render();
  }
  else if(a==="turbo"){
    const cost=3*(i+1)*(k+1), key=k+"-"+i;
    if(S.turbo[key]||S.gold<cost) return;
    S.gold-=cost; S.turbo[key]=true; snd("ok"); toast("Turbo aktiviert: "+bz(k,i).n); save(true); render();
  }
  else if(a==="upg"){
    const t=tierOf(k,i), c=upCost(t);
    if(t>=UP_MAX||S.gems<c) return;
    S.gems-=c; S.up[k+"-"+i]=t+1; snd("ok"); toast(bz(k,i).n+" aufgewertet: Stufe "+(t+1)); save(true); render();
  }
  else if(a==="magnet"){ if(S.magnet||S.gold<15) return; S.gold-=15; S.magnet=true; snd("ok"); save(true); render(); }
  else if(a==="offl"){ if(S.offl||S.gold<25) return; S.gold-=25; S.offl=true; snd("ok"); save(true); render(); }
  else if(a==="pull") pullCard(false);
  else if(a==="theme"){
    const t=THEMES.find(x=>x.id===el.dataset.id); if(!t) return;
    if(!S.themes.includes(t.id)){ if(S.gold<t.cost) return; S.gold-=t.cost; S.themes.push(t.id); toast(t.n+" freigeschaltet!"); confetti(); }
    S.theme=t.id; applyTheme(); snd("ok"); save(true); render();
  }
  else if(a==="sclaim"){
    const r=SEASON[i]; if(!r||S.season.sp<r.sp||S.season.claimed.includes(i)) return;
    S.season.claimed.push(i);
    if(r.gem) S.gems+=r.gem; if(r.gold) S.gold+=r.gold;
    if(r.cash) earn(Math.max(1000,ips()*600*r.cash));
    if(r.pack){ pullCard(true); }
    toast("Saisonbelohnung: "+seasonText(r)); confetti(); snd("lvl"); save(true); render();
  }
  else if(a==="gift"){
    const today=dayKey(); if(S.gift.last===today) return;
    const streak=S.gift.last===yesterdayKey() ? S.gift.streak+1 : 1;
    const gem=GIFT[Math.min(streak-1,GIFT.length-1)], cash=Math.max(500,ips()*300)*streak;
    S.gift={last:today,streak}; S.gems+=gem; earn(cash);
    toast("Geschenk: +"+gem+" Edelsteine und +"+fmt(cash)+" Geld"); confetti(); snd("lvl"); save(true); render();
  }
  else if(a==="sound"){ S.sound=!S.sound; snd("ok"); render(); }
  else if(a==="music"){ S.music=!S.music; musicSet(); render(); }
  else if(a==="vib"){ S.vib=!S.vib; vib(30); render(); }
  else if(a==="nf"){ S.nf={short:"de",de:"sci",sci:"short"}[S.nf]||"short"; render(); }
  else if(a==="export") exportSave();
  else if(a==="import") importSave();
  else if(a==="wipe"){
    ev.preventDefault();
    if(confirm("Spielstand wirklich komplett löschen?")){
      try{ localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); }catch(_){}
      S=fresh(); applyTheme(); buildCards(); musicSet(); render();
    }
  }
});

/* ================= Bonus-Koffer ================= */
function spawnCase(){
  const el=document.createElement("button");
  el.className="case"; el.innerHTML=ico("case");
  el.style.left=(10+Math.random()*70)+"%"; el.style.top=(25+Math.random()*45)+"%";
  el.addEventListener("click",()=>{
    S.st.cases++; addProg("cases",1);
    if(Math.random()<0.3){ S.gems+=2; toast("Bonus: +2 Edelsteine"); }
    else{ const v=Math.max(100,ips()*120); earn(v); toast("Bonus: +"+fmt(v)+" Geld"); }
    snd("ok"); vib(20); el.remove(); render(); save(true);
  });
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),12000);
}
function scheduleCase(){
  const base=S.magnet ? 22000 : 45000;
  setTimeout(()=>{ spawnCase(); scheduleCase(); },base+Math.random()*base);
}

/* ================= Start ================= */
load(); applyTheme(); ensureDaily();
$("ci1").innerHTML=ico("cash"); $("ci2").innerHTML=ico("gold"); $("ci3").innerHTML=ico("gem");
$("nav").innerHTML=TABS.map((x,j)=>`<button data-act="tab" data-t="${x[0]}" class="${j===0?"on":""}">${ico(x[1])}${x[2]}</button>`).join("");
buildCards();
const limit=(S.offl?12:8)*3600;
const away=Math.min((Date.now()-S.last)/1000,limit);
if(away>30){
  const gain=advance(away*(1+0.25*S.tree.offl),true);
  if(gain>0) setTimeout(()=>toast("Während du weg warst: +"+fmt(gain)+" Geld"),400);
}
if(S.gift.last!==dayKey()) setTimeout(()=>toast("Dein tägliches Geschenk wartet (Reiter Aufgaben)"),2200);
render(); scheduleCase();
/* Musik darf erst nach der ersten Berührung starten */
if(S.music) document.addEventListener("pointerdown",()=>musicSet(),{once:true});

let prev=performance.now(), acc=0;
function frame(now){
  const dt=Math.min((now-prev)/1000,1); prev=now; acc+=dt; S.st.time+=dt;
  advance(dt,false); paint();
  if(acc>=0.25){ acc=0; render(); save(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) save(true);
  else{
    const gone=Math.min((Date.now()-S.last)/1000,limit);
    prev=performance.now();
    if(gone>5){ const g=advance(gone*(1+0.25*S.tree.offl),true); if(g>0) toast("Zwischenzeitlich: +"+fmt(g)+" Geld"); }
  }
});
</script>
