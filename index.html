<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#2d5a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Junimo Guide">
<meta name="description" content="Stardew-Valley-Begleiter: Gemeinschaftszentrum, Anbauplanung und Berufe.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<title>Junimo Guide</title>
<style>
:root{
  --bg:#f4ecd8; --card:#fffdf6; --ink:#33291c; --muted:#7d7263;
  --line:#e0d3b6; --brand:#2d5a3d; --brand2:#4a8259; --gold:#a8791c;
  --chip:#ece0c6; --chipink:#5c4f3a; --red:#a13b34; --redbg:#f7dcd8;
  --blue:#2f5f86; --bluebg:#dbe8f3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1712; --card:#232019; --ink:#ece3d2; --muted:#9c9282;
    --line:#3a342a; --brand:#4a8259; --brand2:#5c9a6c; --gold:#d3a54a;
    --chip:#332d22; --chipink:#cdc2aa; --red:#e8877c; --redbg:#3d2521;
    --blue:#8cb6da; --bluebg:#1f2d3a;
  }
  :root:not([data-theme="light"]) .chip.ok{background:#22331f;color:#8fc79b}
}
:root[data-theme="dark"]{
  --bg:#1a1712; --card:#232019; --ink:#ece3d2; --muted:#9c9282;
  --line:#3a342a; --brand:#4a8259; --brand2:#5c9a6c; --gold:#d3a54a;
  --chip:#332d22; --chipink:#cdc2aa; --red:#e8877c; --redbg:#3d2521;
  --blue:#8cb6da; --bluebg:#1f2d3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
}
header{
  background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;flex:1}
h1 span{opacity:.75;font-weight:500;font-size:12px;display:block}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 0 8px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.tight{padding:11px 13px}
.row{display:flex;align-items:center;gap:11px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13.5px}
.tiny{font-size:12px;color:var(--muted)}
b,strong{font-weight:700}
.bar{height:10px;background:var(--line);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:20px;transition:width .3s}
.big{font-size:27px;font-weight:800;color:var(--brand2);line-height:1}
.chip{display:inline-block;background:var(--chip);color:var(--chipink);border-radius:9px;padding:3px 8px;font-size:11.5px;font-weight:600;margin:4px 4px 0 0;white-space:nowrap}
.chip.rain{background:var(--bluebg);color:var(--blue)}
.chip.warn{background:var(--redbg);color:var(--red)}
.chip.ok{background:#d9ead9;color:#2d5a3d}
:root[data-theme="dark"] .chip.ok{background:#22331f;color:#8fc79b}
input[type=checkbox]{width:26px;height:26px;flex:0 0 26px;accent-color:var(--brand2);margin:0}
input[type=search],select,input[type=number]{
  font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none;
}
input[type=number]{width:74px;text-align:center;padding:7px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.filters{display:flex;gap:8px;margin:10px 0}
.filters>*{flex:1;min-width:0}
.segs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.seg.on{background:var(--brand);color:#fff;border-color:var(--brand)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav button{border:0;background:none;color:var(--muted);padding:5px 2px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button em{font-style:normal;font-size:19px;line-height:1}
nav button.on{color:var(--brand2)}
details{border:1px solid var(--line);border-radius:16px;background:var(--card);margin:10px 0;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.arrow{color:var(--muted);font-size:13px;transition:transform .2s}
details[open] .arrow{transform:rotate(90deg)}
.item{padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.done{opacity:.45}
.item.done .iname{text-decoration:line-through}
.iname{font-weight:650}
.en{font-weight:400;color:var(--muted);font-size:12.5px}
.reward{background:var(--chip);color:var(--chipink);padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.money{font-weight:800;color:var(--gold);white-space:nowrap}
.rank{width:26px;height:26px;flex:0 0 26px;border-radius:9px;background:var(--chip);color:var(--chipink);display:grid;place-items:center;font-size:12.5px;font-weight:800}
.rank.g1{background:var(--gold);color:#fff}
.note{border-left:3px solid var(--brand2);padding-left:11px;margin:9px 0;font-size:13.5px;color:var(--muted)}
.pro{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:var(--bg)}
.pro.pick{border-color:var(--brand2);border-width:2px;background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
ul{margin:7px 0;padding-left:20px}
li{margin:4px 0;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
a{color:var(--brand2)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-size:14px;font-weight:600;width:100%}
.btn.danger{color:var(--red);border-color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🌿 Junimo Guide<span id="sub">Stardew Valley Begleiter</span></h1>

<main class="wrap" id="app"></main>

/* ============================================================
   STATE
============================================================ */
const KEY = "junimo_guide_v3";
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return {done:{}, have:{}, season:"Frühling", theme:null, tiller:false, quality:"normal"};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let page = "home";

/* alle Items flach, mit Referenz auf Raum + Bündel */
const ALL = [];
CC.forEach(r => r.bundles.forEach(b => b.items.forEach(i => {
  ALL.push(Object.assign({}, i, {room:r.room, bundle:b.name, key:r.room+"|"+b.name+"|"+i.de}));
})));

const isDone = it => !!S.done[it.key] || (S.have[it.key]||0) >= it.q;
const bundleDone = (room,b) => b.items.filter(i=>isDone(Object.assign({},i,{key:room+"|"+b.name+"|"+i.de, q:i.q}))) .length >= b.need;
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.round(n).toLocaleString("de-DE");

/* ============================================================
   ANSICHTEN
============================================================ */
function seasonSegs(active, attr, list){
  return `<div class="segs">${(list||SEASONS).map(s=>
    `<button class="seg ${s===active?"on":""}" data-${attr}="${s}">${s}</button>`).join("")}</div>`;
}

/* ---------- Übersicht ---------- */
function viewHome(){
  const total = ALL.length, done = ALL.filter(isDone).length;
  const pct = Math.round(done/total*100);

  const rooms = CC.map(r=>{
    const its = r.bundles.flatMap(b=>b.items.map(i=>({key:r.room+"|"+b.name+"|"+i.de, q:i.q})));
    const d = its.filter(isDone).length;
    const bd = r.bundles.filter(b=>bundleDone(r.room,b)).length;
    return {r, d, t:its.length, bd, bt:r.bundles.length};
  });

  // Was ist NUR in der gewählten Jahreszeit verfügbar und noch offen?
  const sea = S.season;
  const urgent = ALL.filter(i => !isDone(i) && i.s && i.s.length && i.s.includes(sea) && i.s.length <= 2);
  const plan = PLAN.find(p=>p.s===sea);

  return `
  <h2>Gesamtfortschritt</h2>
  <div class="card">
    <div class="row between" style="margin-bottom:9px">
      <div><b style="font-size:17px">${done} / ${total}</b><div class="tiny">Gegenstände eingesammelt</div></div>
      <div class="big">${pct}%</div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>

  <h2>Räume</h2>
  ${rooms.map(o=>`
    <div class="card tight">
      <div class="row between">
        <div class="grow"><b>${o.r.icon} ${esc(o.r.room)}</b>
          <div class="tiny">${o.bd}/${o.bt} Bündel · ${o.d}/${o.t} Gegenstände</div></div>
        <div class="money">${Math.round(o.d/o.t*100)}%</div>
      </div>
      <div class="bar" style="margin-top:8px"><i style="width:${o.d/o.t*100}%"></i></div>
    </div>`).join("")}

  <h2>Aktuelle Jahreszeit</h2>
  ${seasonSegs(sea,"season")}
  <div class="card">
    <b>📋 Fahrplan ${esc(sea)}</b>
    <ul>${plan.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
  </div>

  <h2>Nur im ${esc(sea)} verfügbar – noch offen</h2>
  ${urgent.length ? urgent.map(itemCard).join("")
    : `<div class="card empty">Nichts Dringendes für diese Jahreszeit. 🎉</div>`}

  <h2>Daten</h2>
  <div class="card">
    <p class="tiny" style="margin-top:0">Dein Fortschritt wird nur lokal auf diesem iPhone gespeichert.</p>
    <button class="btn danger" id="reset">Fortschritt zurücksetzen</button>
  </div>`;
}

function itemCard(i){
  const have = S.have[i.key]||0, missing = Math.max(0, i.q - have), d = isDone(i);
  return `<div class="card tight ${d?"done":""}" style="${d?"opacity:.5":""}">
    <div class="row">
      <input type="checkbox" data-done="${esc(i.key)}" ${d?"checked":""}>
      <div class="grow">
        <div class="iname">${esc(i.de)}${i.q>1?` <span class="money">×${i.q}</span>`:""}</div>
        <div class="tiny">${esc(i.en)} · ${esc(i.room)} › ${esc(i.bundle)}</div>
      </div>
    </div>
    <div class="tiny" style="margin-top:7px">📍 ${esc(i.where)}</div>
    <div>${chips(i)}</div>
    ${i.q>1 && !d ? `<div class="row between" style="margin-top:8px">
      <span class="tiny">Noch <b>${missing}</b> von ${i.q}</span>
      <input type="number" min="0" inputmode="numeric" data-have="${esc(i.key)}" value="${have}">
    </div>`:""}
  </div>`;
}

function chips(i){
  let out = "";
  if(i.s && i.s.length) out += i.s.map(s=>`<span class="chip">${s}</span>`).join("");
  else out += `<span class="chip ok">ganzjährig</span>`;
  if(i.time) out += `<span class="chip">🕒 ${esc(i.time)}</span>`;
  if(i.weather) out += `<span class="chip ${/Regen/.test(i.weather)?"rain":"warn"}">${/Regen/.test(i.weather)?"🌧":"☀️"} ${esc(i.weather)}</span>`;
  return out;
}

function viewCC(){
  return `
  <h2>Gemeinschaftszentrum</h2>
  <div class="filters">
    <input type="search" id="q" placeholder="Gegenstand suchen…" value="${esc(S.q||"")}">
  </div>
  <div class="filters">
    <select id="fseason">
      <option>Alle Jahreszeiten</option>
      ${SEASONS.map(s=>`<option ${S.fs===s?"selected":""}>${s}</option>`).join("")}
    </select>
    <select id="fopen">
      <option value="all" ${S.fo==="all"?"selected":""}>Alle anzeigen</option>
      <option value="open" ${S.fo==="open"?"selected":""}>Nur offene</option>
    </select>
  </div>
  <div id="cclist"></div>`;
}

function renderCCList(){
  const q = (S.q||"").toLowerCase().trim();
  const fs = S.fs || "Alle Jahreszeiten";
  const fo = S.fo || "all";
  const el = document.getElementById("cclist");
  if(!el) return;

  const match = i => {
    if(q && !(i.de+" "+i.en+" "+i.where).toLowerCase().includes(q)) return false;
    if(fs !== "Alle Jahreszeiten" && i.s && i.s.length && !i.s.includes(fs)) return false;
    if(fo === "open" && isDone(i)) return false;
    return true;
  };

  let html = "", any = false;
  CC.forEach(r=>{
    let rooms = "";
    r.bundles.forEach(b=>{
      const items = b.items.map(i=>Object.assign({},i,{room:r.room,bundle:b.name,key:r.room+"|"+b.name+"|"+i.de}));
      const shown = items.filter(match);
      if(!shown.length) return;
      const d = items.filter(isDone).length;
      const ok = d >= b.need;
      rooms += `<details ${q?"open":""}>
        <summary>
          <span class="arrow">▶</span>
          <span class="grow"><b>${esc(b.name)}</b>
            <div class="tiny">${d}/${b.need} gesammelt${b.need < items.length?` (aus ${items.length} möglichen)`:""}</div></span>
          <span class="chip ${ok?"ok":""}">${ok?"✓ fertig":d+"/"+b.need}</span>
        </summary>
        <div class="reward">🎁 Belohnung: ${esc(b.reward)}</div>
        ${shown.map(rowItem).join("")}
      </details>`;
    });
    if(rooms){
      any = true;
      html += `<h2>${r.icon} ${esc(r.room)}</h2>
        <div class="note">🏆 ${esc(r.roomReward)}</div>${rooms}`;
    }
  });
  el.innerHTML = any ? html : `<div class="card empty">Nichts gefunden.</div>`;
  bindInputs();
}

function rowItem(i){
  const have = S.have[i.key]||0, d = isDone(i);
  return `<div class="item ${d?"done":""}">
    <div class="row">
      <input type="checkbox" data-done="${esc(i.key)}" ${d?"checked":""}>
      <div class="grow">
        <div class="iname">${esc(i.de)}${i.q>1?` <span class="money">×${i.q}</span>`:""}</div>
        <div class="en">${esc(i.en)}</div>
      </div>
      ${i.q>1?`<input type="number" min="0" inputmode="numeric" data-have="${esc(i.key)}" value="${have}">`:""}
    </div>
    <div class="tiny" style="margin-top:5px">📍 ${esc(i.where)}</div>
    <div>${chips(i)}</div>
  </div>`;
}

/* ---------- Anbau / Gewinn ---------- */
const QUAL = {normal:1, silber:1.25, gold:1.5, iridium:2};

/* Gewächshaus wird über ein ganzes Jahr (4 Jahreszeiten) gerechnet,
   sonst sähe die Uralte Frucht mit ihren 28 Wachstumstagen künstlich schlecht aus. */
function cropMath(c){
  const DAYS = c.span || (c.s === "Gewächshaus" ? 112 : 28);
  const mult = QUAL[S.quality] * (S.tiller ? 1.1 : 1);
  const price = Math.floor(c.sell * mult);
  let harvests, seedCost;
  if(c.regrow > 0){
    if(c.days > DAYS) return null;
    harvests = 1 + Math.floor((DAYS - c.days) / c.regrow);
    seedCost = c.seed;                       // einmal kaufen
  } else {
    harvests = Math.floor(DAYS / c.days);
    if(!harvests) return null;
    // seedOnce: die Pflanze liefert beim Ernten neue Saat (z. B. Sonnenblume)
    seedCost = c.seedOnce ? c.seed : c.seed * harvests;
  }
  const gross = harvests * c.yield * price;
  const profit = gross - seedCost;
  return {harvests, price, profit, perDay: profit / DAYS, days: DAYS};
}

function viewFarm(){
  const sea = S.farmSeason || "Frühling";
  const tabs = ["Frühling","Sommer","Herbst","Winter","Gewächshaus"];
  return `
  <h2>Anbauplanung</h2>
  <div class="segs">${tabs.map(s=>
    `<button class="seg ${s===sea?"on":""}" data-farm="${s}">${s}</button>`).join("")}</div>

  <div class="card tight">
    <div class="row between">
      <span class="tiny grow">Beruf <b>Ackerbauer</b> (+10 %)</span>
      <input type="checkbox" id="tiller" ${S.tiller?"checked":""}>
    </div>
    <div class="row between" style="margin-top:9px">
      <span class="tiny grow">Erntequalität</span>
      <select id="qual" style="width:auto;min-width:130px">
        ${Object.keys(QUAL).map(k=>`<option value="${k}" ${S.quality===k?"selected":""}>${k[0].toUpperCase()+k.slice(1)}</option>`).join("")}
      </select>
    </div>
  </div>

  <div id="farmlist"></div>`;
}

function renderFarm(){
  const el = document.getElementById("farmlist");
  if(!el) return;
  const sea = S.farmSeason || "Frühling";

  if(sea === "Winter"){
    el.innerHTML = `
    <div class="card">
      <b>❄️ Im Winter wächst draußen nichts.</b>
      <p class="muted">Ausnahme: Wintersaat (aus dem Sammeln-Bündel) liefert Wildpflanzen – kein echter Gewinn. So holst du im Winter trotzdem Geld raus:</p>
      <ul>
        <li><b>Gewächshaus</b> (Belohnung der Vorratskammer) – hier laufen alle Pflanzen ganzjährig weiter.</li>
        <li><b>Skull Cavern</b> in der Wüste: Iridium, Prismasplitter, Edelsteine.</li>
        <li><b>Angeln</b>: Stör und Tigerforelle gibt es nur jetzt, ebenso die Nautilusschale am Strand.</li>
        <li><b>Fässer und Einmachgläser</b> mit der Herbsternte durchlaufen lassen – Wein reift auch im Winter.</li>
        <li><b>Nachtmarkt</b> 15.–17. Winter am Strand.</li>
        <li><b>Tiere</b> produzieren im Stall weiter – aber Schweine geben draußen keine Trüffel.</li>
      </ul>
    </div>
    ${renderCropCards(CROPS.filter(c=>c.s==="Gewächshaus"), "Fürs Gewächshaus")}`;
    return;
  }

  const list = CROPS.filter(c=>c.s===sea);
  const intro = sea === "Gewächshaus"
    ? `<div class="note">Gerechnet über ein volles Jahr (112 Tage), weil im Gewächshaus keine Jahreszeit dazwischenfunkt. Sortiert nach Gewinn pro Tag und Feld.</div>`
    : `<div class="note">Gerechnet über eine Saison (28 Tage), am 1. Tag gesät, Nachkauf der Saat eingerechnet. Sortiert nach Gewinn pro Tag und Feld.</div>`;
  el.innerHTML = intro + renderCropCards(list) + artisanBox(sea);
}

function renderCropCards(list, title){
  const rows = list.map(c=>({c, m:cropMath(c)})).filter(o=>o.m).sort((a,b)=>b.m.perDay - a.m.perDay);
  return (title?`<h2>${esc(title)}</h2>`:"") + rows.map((o,idx)=>{
    const c = o.c, m = o.m;
    return `<div class="card">
      <div class="row between">
        <div class="row grow" style="gap:9px">
          <span class="rank ${idx===0?"g1":""}">${idx+1}</span>
          <div class="grow"><b>${esc(c.de)}</b><div class="en">${esc(c.en)}</div></div>
        </div>
        <div style="text-align:right">
          <div class="money">${fmt(m.perDay)} G</div>
          <div class="tiny">pro Tag/Feld</div>
        </div>
      </div>
      <div style="margin-top:7px">
        <span class="chip">🌱 ${c.seed?fmt(c.seed)+" G Saat":"Saat: besonders"}</span>
        <span class="chip">⏱ ${c.days} Tage</span>
        ${c.regrow?`<span class="chip ok">↻ alle ${c.regrow} Tage</span>`:`<span class="chip">einmalige Ernte</span>`}
        ${c.yield>1?`<span class="chip ok">×${c.yield} pro Ernte</span>`:""}
        <span class="chip">💰 ${fmt(m.price)} G Stück</span>
      </div>
      <div class="tiny" style="margin-top:7px">
        ${m.harvests} Ernte${m.harvests>1?"n":""} in ${m.days} Tagen · <b>${fmt(m.profit)} G</b> Reingewinn je Feld · Saat bei: ${esc(c.src)}
      </div>
      ${c.note?`<div class="note" style="margin-bottom:0">${esc(c.note)}</div>`:""}
    </div>`;
  }).join("");
}

function artisanBox(sea){
  const tips = {
    "Frühling":"Kartoffeln und Grünkohl roh verkaufen, Erdbeeren lieber ins Einmachglas (Erdbeermarmelade 290 G statt 120 G).",
    "Sommer":"Hopfen gehört ins Fass: Pale Ale 300 G, alle 2 Tage. Heidelbeeren ins Einmachglas (150 G statt 50 G). Sternfrucht ins Fass: Wein 2.250 G.",
    "Herbst":"Kürbis ins Fass? Nein – Kürbis ist kein Obst. Preiselbeeren ins Einmachglas (200 G), Trauben ins Fass (Wein 240 G).",
    "Gewächshaus":"Uralte Frucht ins Fass: Wein 1.650 G (mit Kunsthandwerker 2.310 G). Das ist die profitabelste Dauerschleife im Spiel."
  };
  return `<div class="card">
    <b>🍷 Verarbeiten statt roh verkaufen</b>
    <ul>
      <li><b>Fass (Keg):</b> Obst → Wein = <b>3× Grundpreis</b>. Gemüse → Saft = 2,25×. Hopfen → Pale Ale = 300 G.</li>
      <li><b>Einmachglas:</b> Obst → Gelee, Gemüse → Pickles = <b>2× Grundpreis + 50 G</b>. Schneller als das Fass, aber bei teuren Früchten schlechter.</li>
      <li><b>Faustregel:</b> billige Früchte → Einmachglas, teure Früchte → Fass. Mit dem Beruf <b>Kunsthandwerker</b> kommen nochmal +40 % obendrauf.</li>
    </ul>
    <div class="note" style="margin-bottom:0">${esc(tips[sea] || tips["Frühling"])}</div>
  </div>`;
}

function proCard(p){
  return `<div class="pro ${p.pick?"pick":""}">
    <div class="row between">
      <b>${esc(p.n)}</b>
      ${p.pick?`<span class="chip ok">Empfehlung</span>`:""}
    </div>
    <div class="tiny" style="margin-top:3px">${esc(p.d)}</div>
    ${p.from?`<div class="tiny" style="margin-top:3px">↳ setzt <b>${esc(p.from)}</b> voraus</div>`:""}
    <div class="note" style="margin-bottom:0">${esc(p.why)}</div>
  </div>`;
}

/* ============================================================
   RENDER & EVENTS
============================================================ */
function bindInputs(){
  document.querySelectorAll("[data-done]").forEach(el=>{
    el.onchange = () => {
      const k = el.getAttribute("data-done");
      if(el.checked) S.done[k] = true; else { delete S.done[k]; delete S.have[k]; }
      save(); render(true);
    };
  });
  document.querySelectorAll("[data-have]").forEach(el=>{
    el.onchange = () => {
      const k = el.getAttribute("data-have");
      S.have[k] = Math.max(0, parseInt(el.value,10) || 0);
      save(); render(true);
    };
  });
}

function render(keepScroll){
  const y = window.scrollY;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.p===page));
  const app = document.getElementById("app");
  const sub = document.getElementById("sub");

  if(page==="home"){ app.innerHTML = viewHome(); sub.textContent = "Übersicht & Fahrplan"; }
  else if(page==="cc"){ app.innerHTML = viewCC(); sub.textContent = "Gemeinschaftszentrum"; renderCCList(); }
  else if(page==="farm"){ app.innerHTML = viewFarm(); sub.textContent = "Gewinn pro Jahreszeit"; renderFarm(); }
  else { app.innerHTML = viewSkills(); sub.textContent = "Fähigkeiten & Berufe"; }

  bindInputs();
  wire();
  if(keepScroll) window.scrollTo(0, y); else window.scrollTo(0,0);
}

function wire(){
  document.querySelectorAll("[data-season]").forEach(b=>{
    b.onclick = () => { S.season = b.dataset.season; save(); render(); };
  });
  document.querySelectorAll("[data-farm]").forEach(b=>{
    b.onclick = () => { S.farmSeason = b.dataset.farm; save(); render(); };
  });
  const q = document.getElementById("q");
  if(q) q.oninput = () => { S.q = q.value; renderCCList(); };
  const fs = document.getElementById("fseason");
  if(fs) fs.onchange = () => { S.fs = fs.value; save(); renderCCList(); };
  const fo = document.getElementById("fopen");
  if(fo) fo.onchange = () => { S.fo = fo.value; save(); renderCCList(); };
  const t = document.getElementById("tiller");
  if(t) t.onchange = () => { S.tiller = t.checked; save(); renderFarm(); };
  const qu = document.getElementById("qual");
  if(qu) qu.onchange = () => { S.quality = qu.value; save(); renderFarm(); };
  const rs = document.getElementById("reset");
  if(rs) rs.onclick = () => {
    if(confirm("Wirklich den gesamten Fortschritt löschen?")){
      S.done = {}; S.have = {}; save(); render();
    }
  };
}

/* Theme */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
document.getElementById("themeBtn").onclick = () => {
  S.theme = S.theme === "dark" ? "light" : S.theme === "light" ? null : "dark";
  save(); applyTheme();
};

document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = () => { page = b.dataset.p; render(); };
});

applyTheme();
render();
</script>
