<title>Junimo Guide</title>
<style>
:root{
  --bg:#f4ecd8; --card:#fffdf6; --ink:#33291c; --muted:#7d7263;
  --line:#e0d3b6; --brand:#2d5a3d; --brand2:#4a8259; --gold:#a8791c;
  --chip:#ece0c6; --chipink:#5c4f3a; --red:#a13b34; --redbg:#f7dcd8;
  --blue:#2f5f86; --bluebg:#dbe8f3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1712; --card:#232019; --ink:#ece3d2; --muted:#9c9282;
    --line:#3a342a; --brand:#4a8259; --brand2:#5c9a6c; --gold:#d3a54a;
    --chip:#332d22; --chipink:#cdc2aa; --red:#e8877c; --redbg:#3d2521;
    --blue:#8cb6da; --bluebg:#1f2d3a;
  }
  :root:not([data-theme="light"]) .chip.ok{background:#22331f;color:#8fc79b}
}
:root[data-theme="dark"]{
  --bg:#1a1712; --card:#232019; --ink:#ece3d2; --muted:#9c9282;
  --line:#3a342a; --brand:#4a8259; --brand2:#5c9a6c; --gold:#d3a54a;
  --chip:#332d22; --chipink:#cdc2aa; --red:#e8877c; --redbg:#3d2521;
  --blue:#8cb6da; --bluebg:#1f2d3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
}
header{
  background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;flex:1}
h1 span{opacity:.75;font-weight:500;font-size:12px;display:block}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 0 8px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.tight{padding:11px 13px}
.row{display:flex;align-items:center;gap:11px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13.5px}
.tiny{font-size:12px;color:var(--muted)}
b,strong{font-weight:700}
.bar{height:10px;background:var(--line);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:20px;transition:width .3s}
.big{font-size:27px;font-weight:800;color:var(--brand2);line-height:1}
.chip{display:inline-block;background:var(--chip);color:var(--chipink);border-radius:9px;padding:3px 8px;font-size:11.5px;font-weight:600;margin:4px 4px 0 0;white-space:nowrap}
.chip.rain{background:var(--bluebg);color:var(--blue)}
.chip.warn{background:var(--redbg);color:var(--red)}
.chip.ok{background:#d9ead9;color:#2d5a3d}
:root[data-theme="dark"] .chip.ok{background:#22331f;color:#8fc79b}
input[type=checkbox]{width:26px;height:26px;flex:0 0 26px;accent-color:var(--brand2);margin:0}
input[type=search],select,input[type=number]{
  font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none;
}
input[type=number]{width:74px;text-align:center;padding:7px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.filters{display:flex;gap:8px;margin:10px 0}
.filters>*{flex:1;min-width:0}
.segs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.seg.on{background:var(--brand);color:#fff;border-color:var(--brand)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav button{border:0;background:none;color:var(--muted);padding:5px 2px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button em{font-style:normal;font-size:19px;line-height:1}
nav button.on{color:var(--brand2)}
details{border:1px solid var(--line);border-radius:16px;background:var(--card);margin:10px 0;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.arrow{color:var(--muted);font-size:13px;transition:transform .2s}
details[open] .arrow{transform:rotate(90deg)}
.item{padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.done,.card.done{opacity:.45}
.item.done .iname,.card.done .iname{text-decoration:line-through}
.iname{font-weight:650}
.en{font-weight:400;color:var(--muted);font-size:12.5px}
.reward{background:var(--chip);color:var(--chipink);padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.money{font-weight:800;color:var(--gold);white-space:nowrap}
.rank{width:26px;height:26px;flex:0 0 26px;border-radius:9px;background:var(--chip);color:var(--chipink);display:grid;place-items:center;font-size:12.5px;font-weight:800}
.rank.g1{background:var(--gold);color:#fff}
.note{border-left:3px solid var(--brand2);padding-left:11px;margin:9px 0;font-size:13.5px;color:var(--muted)}
.pro{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0;background:var(--bg)}
.pro.pick{border-color:var(--brand2);border-width:2px;background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
ul{margin:7px 0;padding-left:20px}
li{margin:4px 0;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
a{color:var(--brand2)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-size:14px;font-weight:600;width:100%}
.btn.danger{color:var(--red);border-color:var(--red)}
</style>
</head>

function itemCard(i){
  const have = S.have[i.key]||0, missing = Math.max(0, i.q - have), d = isDone(i);
  return `<div class="card tight ${d?"done":""}" data-key="${esc(i.key)}">

      <div class="grow">
        <div class="iname">${esc(i.de)}${i.q>1?` <span class="money">×${i.q}</span>`:""}</div>
        <div class="tiny">${esc(i.en)} · ${esc(i.room)} › ${esc(i.bundle)}</div>
      </div>
    </div>
    <div class="tiny" style="margin-top:7px">📍 ${esc(i.where)}</div>
    <div>${chips(i)}</div>
    ${i.q>1 ? `<div class="row between" style="margin-top:8px">
      <span class="tiny">Noch <b class="rest">${missing}</b> von ${i.q}</span>
      <input type="number" min="0" inputmode="numeric" data-have="${esc(i.key)}" value="${have}">

function chips(i){
  let out = "";
  if(i.s && i.s.length) out += i.s.map(s=>`<span class="chip">${s}</span>`).join("");
  else out += `<span class="chip ok">ganzjährig</span>`;
  if(i.time) out += `<span class="chip">🕒 ${esc(i.time)}</span>`;
  if(i.weather) out += `<span class="chip ${/Regen/.test(i.weather)?"rain":"warn"}">${/Regen/.test(i.weather)?"🌧":"☀️"} ${esc(i.weather)}</span>`;
  return out;
}

function renderCCList(){
  const q = (S.q||"").toLowerCase().trim();
  const fs = S.fs || "Alle Jahreszeiten";
  const fo = S.fo || "all";
  const el = document.getElementById("cclist");
  if(!el) return;

  const match = i => {
    if(q && !(i.de+" "+i.en+" "+i.where).toLowerCase().includes(q)) return false;
    if(fs !== "Alle Jahreszeiten" && i.s && i.s.length && !i.s.includes(fs)) return false;
    if(fo === "open" && isDone(i)) return false;
    return true;
  };

  let html = "", any = false;
  CC.forEach(r=>{
    let rooms = "";
    r.bundles.forEach(b=>{

      const d = items.filter(isDone).length;

/* ---------- Anbau / Gewinn ---------- */
const QUAL = {normal:1, silber:1.25, gold:1.5, iridium:2};

/* Gewächshaus wird über ein ganzes Jahr (4 Jahreszeiten) gerechnet,
   sonst sähe die Uralte Frucht mit ihren 28 Wachstumstagen künstlich schlecht aus. */
function cropMath(c){
  const DAYS = c.span || (c.s === "Gewächshaus" ? 112 : 28);
  const mult = QUAL[S.quality] * (S.tiller ? 1.1 : 1);
  const price = Math.floor(c.sell * mult);
  let harvests, seedCost;
  if(c.regrow > 0){
    if(c.days > DAYS) return null;
    harvests = 1 + Math.floor((DAYS - c.days) / c.regrow);
    seedCost = c.seed;                       // einmal kaufen
  } else {
    harvests = Math.floor(DAYS / c.days);
    if(!harvests) return null;
    // seedOnce: die Pflanze liefert beim Ernten neue Saat (z. B. Sonnenblume)
    seedCost = c.seedOnce ? c.seed : c.seed * harvests;
  }
  const gross = harvests * c.yield * price;
  const profit = gross - seedCost;
  return {harvests, price, profit, perDay: profit / DAYS, days: DAYS};
}

function phase(){
  const y = S.year || 1, s = S.season;
  if(y >= 3) return ENDGAME;
  return PHASES.find(p=>p.y===y && p.s===s) || ENDGAME;
}

      <div class="grow"><b>${esc(e.n)}</b><div class="tiny">${esc(s)}, Tag ${e.d}</div></div>
      <span class="chip ${e.d-day<=3?"warn":""}">${e.d===day?"heute":e.d-day===1?"morgen":"in "+(e.d-day)+" Tagen"}</span>
    </div>
    ${e.t?`<p class="tiny" style="margin:6px 0 0">${esc(e.t)}</p>`:""}
  </div>`).join("")}`:""}

  <h2>⚠️ Nicht vernachlässigen</h2>
  <div class="card">
    <p class="tiny" style="margin-top:0">Das hier sind die Dinge, die man schleifen lässt und später bereut.</p>
    ${HABITS.map(h=>`<div style="margin:11px 0">
      <b style="font-size:14px">${esc(h.n)}</b>
      <div class="tiny">${esc(h.t)}</div></div>`).join("")}
  </div>

  <h2>➡️ Was danach kommt</h2>
  <div class="card">
    <p style="margin:0" class="muted">${esc(ph.after)}</p>
  </div>`;
}

/* ---------- Mehr: Sammelseite für die Nachschlagewerke ---------- */
const MORE = [
 {p:"gifts", i:"🎁", n:"Geschenke & Geburtstage", d:"Wer mag was, und wann hat wer Geburtstag"},
 {p:"skill", i:"⭐", n:"Fähigkeiten & Berufe",    d:"Welchen Beruf du auf Stufe 5 und 10 wählen solltest"},
];

function viewMore(){
  const sea = S.season, day = S.day || 1;
  const today = VILLAGERS.filter(v=>v.s===sea && v.d===day);
  return `
  <h2>Nachschlagen</h2>
  ${MORE.map(m=>`<div class="card tight" data-go="${m.p}" style="cursor:pointer">
    <div class="row">
      <span style="font-size:26px">${m.i}</span>
      <div class="grow"><b>${esc(m.n)}</b><div class="tiny">${esc(m.d)}</div></div>
      <span class="arrow">▶</span>
    </div>
  </div>`).join("")}
  ${today.length?`<h2>Heute</h2>${today.map(birthdayCard).join("")}`:""}`;
}

/* ---------- Geschenke & Geburtstage ---------- */
function birthdayCard(v){
  return `<div class="card">
    <div class="row between">
      <div class="grow"><b>🎂 ${esc(v.n)} hat Geburtstag</b><div class="tiny">${esc(v.where)}</div></div>
    </div>
    <div style="margin-top:6px">${v.loves.slice(0,6).map(g=>`<span class="chip ok">${esc(g)}</span>`).join("")}</div>
    <div class="note" style="margin-bottom:0">${esc(v.tip)}</div>
  </div>`;
}

function viewGifts(){
  return `
  <h2>Geschenke & Geburtstage</h2>
  <div class="filters"><input type="search" id="gq" placeholder="Person oder Geschenk suchen…" value="${esc(S.gq||"")}"></div>
  <div class="filters">
    <select id="gs">
      <option>Alle Geburtstage</option>
      ${SEASONS.map(s=>`<option ${S.gs===s?"selected":""}>${s}</option>`).join("")}
    </select>
    <select id="gsort">
      <option value="date" ${S.gsort!=="name"?"selected":""}>Nach Datum</option>
      <option value="name" ${S.gsort==="name"?"selected":""}>Nach Name</option>
    </select>
  </div>
  <div id="giftlist"></div>

  <h2>Grundregeln</h2>
  <div class="card">
    ${GIFT_RULES.map(r=>`<div style="margin:11px 0">
      <b style="font-size:14px">${esc(r.n)}</b>
      <div class="tiny">${esc(r.t)}</div></div>`).join("")}
  </div>`;
}

function renderGifts(){
  const el = document.getElementById("giftlist");
  if(!el) return;
  const q = (S.gq||"").toLowerCase().trim();
  const fs = S.gs || "Alle Geburtstage";
  const byName = S.gsort === "name";

  let list = VILLAGERS.filter(v=>{
    if(fs !== "Alle Geburtstage" && v.s !== fs) return false;
    if(q && !(v.n+" "+v.loves.join(" ")+" "+v.where).toLowerCase().includes(q)) return false;
    return true;
  });
  list = list.slice().sort((a,b)=> byName
    ? a.n.localeCompare(b.n,"de")
    : (SEASONS.indexOf(a.s)-SEASONS.indexOf(b.s)) || (a.d-b.d));

  if(!list.length){ el.innerHTML = `<div class="card empty">Nichts gefunden.</div>`; return; }

  const isToday = v => v.s === S.season && v.d === (S.day||1);
  el.innerHTML = list.map(v=>`<div class="card">
    <div class="row between">
      <div class="grow"><b>${esc(v.n)}</b><div class="tiny">${esc(v.where)}</div></div>
      <span class="chip ${isToday(v)?"warn":""}">🎂 ${esc(v.s)} ${v.d}${isToday(v)?" · heute":""}</span>
    </div>
    <div style="margin-top:7px">${v.loves.map(g=>`<span class="chip ok">${esc(g)}</span>`).join("")}</div>
    <div class="note" style="margin-bottom:0">${esc(v.tip)}</div>
  </div>`).join("");
}

/* ============================================================
   RENDER & EVENTS
============================================================ */
/* Nach einer Änderung wird NICHT neu gerendert – sonst klappen die Bündel zu
   und die Seite springt nach oben. Stattdessen werden nur die betroffenen
   Stellen im Dokument nachgezogen. */
function refresh(key){
  // Zustand der Zeile/Karte selbst
  document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(el=>{
    const item = ALL.find(i=>i.key===key);
    if(!item) return;
    const d = isDone(item);
    el.classList.toggle("done", d);
    const box = el.querySelector("[data-done]"); if(box) box.checked = d;
    const rest = el.querySelector(".rest");
    if(rest) rest.textContent = Math.max(0, item.q - (S.have[key]||0));
  });

  // Bündel-Zähler im Gemeinschaftszentrum
  document.querySelectorAll("details[data-bundle]").forEach(det=>{
    const room = det.getAttribute("data-room"), bname = det.getAttribute("data-bundle");
    const r = CC.find(x=>x.room===room); if(!r) return;
    const b = r.bundles.find(x=>x.name===bname); if(!b) return;
    const items = b.items.map(i=>({key:room+"|"+bname+"|"+i.de, q:i.q}));
    const d = items.filter(isDone).length, ok = d >= b.need;
    const cnt = det.querySelector(".bcount");
    if(cnt) cnt.textContent = `${d}/${b.need} gesammelt` + (b.need < items.length ? ` (aus ${items.length} möglichen)` : "");
    const chip = det.querySelector(".bchip");
    if(chip){ chip.textContent = ok ? "✓ fertig" : d+"/"+b.need; chip.classList.toggle("ok", ok); }
  });

  // Fortschrittsbalken auf der Übersicht
  const total = ALL.length, done = ALL.filter(isDone).length, pct = Math.round(done/total*100);
  const pd = document.getElementById("pDone"); if(pd) pd.textContent = `${done} / ${total}`;
  const pp = document.getElementById("pPct");  if(pp) pp.textContent = pct+"%";
  const pb = document.getElementById("pBar");  if(pb) pb.style.width = pct+"%";
  document.querySelectorAll("[data-room]").forEach(card=>{
    if(card.tagName === "DETAILS") return;
    const r = CC.find(x=>x.room===card.getAttribute("data-room")); if(!r) return;
    const its = r.bundles.flatMap(b=>b.items.map(i=>({key:r.room+"|"+b.name+"|"+i.de, q:i.q})));
    const d = its.filter(isDone).length;
    const bd = r.bundles.filter(b=>bundleDone(r.room,b)).length;
    const c = card.querySelector(".rcount");
    if(c) c.textContent = `${bd}/${r.bundles.length} Bündel · ${d}/${its.length} Gegenstände`;
    const p = card.querySelector(".rpct"); if(p) p.textContent = Math.round(d/its.length*100)+"%";
    const bar = card.querySelector(".rbar"); if(bar) bar.style.width = (d/its.length*100)+"%";
  });
}

function bindInputs(){
  document.querySelectorAll("[data-done]").forEach(el=>{
    el.onchange = () => {
      const k = el.getAttribute("data-done");
      if(el.checked){
        S.done[k] = true;
        const item = ALL.find(i=>i.key===k);
        if(item && item.q > 1) S.have[k] = item.q;   // Teilmenge auf "voll" setzen
      } else {
        delete S.done[k]; delete S.have[k];
      }
      save(); refresh(k);
      const num = document.querySelector(`[data-have="${CSS.escape(k)}"]`);
      if(num) num.value = S.have[k] || 0;
    };
  });
  document.querySelectorAll("[data-have]").forEach(el=>{
    el.onchange = () => {
      const k = el.getAttribute("data-have");
      S.have[k] = Math.max(0, parseInt(el.value,10) || 0);
      const item = ALL.find(i=>i.key===k);
      if(item && S.have[k] >= item.q) S.done[k] = true; else delete S.done[k];
      save(); refresh(k);
    };
  });
  // Auf-/Zugeklappte Bündel merken, damit sie beim Blättern offen bleiben
  document.querySelectorAll("details[data-bundle]").forEach(det=>{
    det.ontoggle = () => {
      const k = det.getAttribute("data-room")+"|"+det.getAttribute("data-bundle");
      if(det.open) S.open[k] = true; else delete S.open[k];
      save();
    };
  });
}

/* Unterseiten von "Mehr" lassen den Mehr-Knopf markiert. */
const TAB_OF = {home:"home", plan:"plan", cc:"cc", farm:"farm",
                more:"more", gifts:"more", skill:"more"};

function render(keepScroll){
  const y = window.scrollY;
  const tab = TAB_OF[page] || "home";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.p===tab));
  const app = document.getElementById("app");
  const sub = document.getElementById("sub");

  if(page==="home"){ app.innerHTML = viewHome(); sub.textContent = "Übersicht & Fahrplan"; }
  else if(page==="plan"){ app.innerHTML = viewPlan(); sub.textContent = "Was als Nächstes?"; }
  else if(page==="cc"){ app.innerHTML = viewCC(); sub.textContent = "Gemeinschaftszentrum"; renderCCList(); }
  else if(page==="farm"){ app.innerHTML = viewFarm(); sub.textContent = "Gewinn pro Jahreszeit"; renderFarm(); }
  else if(page==="more"){ app.innerHTML = viewMore(); sub.textContent = "Nachschlagen"; }
  else if(page==="gifts"){ app.innerHTML = viewGifts(); sub.textContent = "Geschenke & Geburtstage"; renderGifts(); }
  else { app.innerHTML = viewSkills(); sub.textContent = "Fähigkeiten & Berufe"; }

  bindInputs();
  wire();
  if(keepScroll) window.scrollTo(0, y); else window.scrollTo(0,0);
}

/* Beim Wechsel der Jahreszeit aendert sich der Inhalt unter den Knoepfen.
   Statt nach oben zu springen, bleibt die Knopfleiste an derselben Stelle
   im Bild stehen. */
function renderAnchored(sel){
  sel = sel || ".segs";
  const a = document.querySelector(sel);
  const off = a ? a.getBoundingClientRect().top : null;
  render();
  if(off === null) return;
  const a2 = document.querySelector(sel);
  if(!a2) return;
  window.scrollTo(0, Math.max(0, a2.getBoundingClientRect().top - off));
}

function wire(){
  document.querySelectorAll("[data-season]").forEach(b=>{
    b.onclick = () => { S.season = b.dataset.season; save(); renderAnchored(); };
  });
  document.querySelectorAll("[data-farm]").forEach(b=>{
    b.onclick = () => { S.farmSeason = b.dataset.farm; save(); renderAnchored(); };
  });
  const q = document.getElementById("q");
  if(q) q.oninput = () => { S.q = q.value; renderCCList(); };
  const fs = document.getElementById("fseason");
  if(fs) fs.onchange = () => { S.fs = fs.value; save(); renderCCList(); };
  const fo = document.getElementById("fopen");
  if(fo) fo.onchange = () => { S.fo = fo.value; save(); renderCCList(); };
  const t = document.getElementById("tiller");
  if(t) t.onchange = () => { S.tiller = t.checked; save(); renderFarm(); };
  const qu = document.getElementById("qual");
  if(qu) qu.onchange = () => { S.quality = qu.value; save(); renderFarm(); };
  document.querySelectorAll("[data-go]").forEach(el=>{
    el.onclick = () => { page = el.getAttribute("data-go"); render(); };
  });
  const gq = document.getElementById("gq");
  if(gq) gq.oninput = () => { S.gq = gq.value; renderGifts(); };
  const gs = document.getElementById("gs");
  if(gs) gs.onchange = () => { S.gs = gs.value; save(); renderGifts(); };
  const gso = document.getElementById("gsort");
  if(gso) gso.onchange = () => { S.gsort = gso.value; save(); renderGifts(); };
  const py = document.getElementById("pYear");
  if(py) py.onchange = () => { S.year = +py.value; save(); renderAnchored(); };
  const pdy = document.getElementById("pDay");
  if(pdy) pdy.onchange = () => {
    S.day = Math.min(28, Math.max(1, parseInt(pdy.value,10) || 1));
    save(); renderAnchored();
  };
  // Sparziele lassen sich in beide Richtungen umschalten: Haken setzen
  // blendet das naechste Ziel ein, Haken entfernen holt das alte zurueck.
  document.querySelectorAll("[data-goal]").forEach(el=>{
    el.onchange = () => {
      const id = el.getAttribute("data-goal");
      if(el.checked) S.bought[id] = true; else delete S.bought[id];
      save();
      renderAnchored("#goalsTop");
    };
  });
  const gd = document.getElementById("goalsDone");
  if(gd) gd.ontoggle = () => { S.openGoals = gd.open; save(); };
  const rs = document.getElementById("reset");
  if(rs) rs.onclick = () => {
    if(confirm("Wirklich den gesamten Fortschritt löschen?")){
      S.done = {}; S.have = {}; S.open = {}; S.bought = {}; save(); render();
    }
  };
}

/* Theme */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
document.getElementById("themeBtn").onclick = () => {
  S.theme = S.theme === "dark" ? "light" : S.theme === "light" ? null : "dark";
  save(); applyTheme();
};

document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = () => { page = b.dataset.p; render(); };
});

applyTheme();
render();
</script>
